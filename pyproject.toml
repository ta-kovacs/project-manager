# Tool configuration. Dependencies are still listed in requirements*.txt.

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports and variables, undefined names
    "I",    # import sorting (isort)
    "B",    # flake8-bugbear: likely bugs and design problems
    "UP",   # pyupgrade: syntax for the target Python version
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
# The alembic/ directory holds migrations; `import alembic` is the third-party package.
known-first-party = ["app", "lambdas", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default arguments; these calls are meant to be there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate` and kept as generated.
"alembic/versions/*" = ["E501", "I", "UP", "W291"]

[tool.ruff.format]
exclude = ["alembic/versions/*"]
