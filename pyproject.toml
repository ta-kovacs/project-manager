[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-manager"
version = "0.1.0"
description = "REST API for managing projects, their members and documents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "takovacs" }]
classifiers = [
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Pinned exactly: this is a deployed application, so every build (Docker image, CI, local) gets the
# same versions. Update them deliberately, one change at a time.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.33",
    "boto3==1.43.125",
    "itsdangerous==2.2.0",
    "email-validator==2.3.0",
    "pyjwt==2.15.1",
]

# Development-only dependencies (PEP 735): never part of the package.
# Install everything with `pip install -e . --group dev`; CI installs single groups.
[dependency-groups]
test = [
    "pytest==8.4.2",
    "httpx2==2.16.0",
    "moto[s3]==5.2.5",
]
lint = ["ruff==0.17.5"]
tools = [
    "build==1.6.1",
    "twine==7.0.0",
    "tox==4.67.13",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "tools" },
]

[tool.hatch.build.targets.wheel]
# Only the application goes into the wheel. Migrations (alembic/) are shipped next to it in the Docker
# image, and the Lambda (lambdas/) is deployed as its own zip.
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app/", "tests/", "README.md", "pytest.ini"]

[tool.tox]
requires = ["tox>=4.22"]
env_list = ["py312", "py313", "py314", "lint"]
# Locally, versions that aren't installed are skipped; CI passes --skip-missing-interpreters=false.
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "run the tests on {base_python}"
dependency_groups = ["test"]
# Point the suite at Postgres, mocked S3 or the SQL backend (see tests/fixtures/app.py).
pass_env = ["TEST_DATABASE_URL", "TEST_STORAGE_BACKEND", "TEST_DATABASE_ACCESS"]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.lint]
description = "lint and check formatting with ruff"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports and variables, undefined names
    "I",    # import sorting (isort)
    "B",    # flake8-bugbear: likely bugs and design problems
    "UP",   # pyupgrade: syntax for the target Python version
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
# The alembic/ directory holds migrations; `import alembic` is the third-party package.
known-first-party = ["app", "lambdas", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default arguments; these calls are meant to be there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate` and kept as generated.
"alembic/versions/*" = ["E501", "I", "UP", "W291"]

[tool.ruff.format]
# Python only (newer ruff versions also format Markdown); migrations are kept as generated.
exclude = ["*.md", "alembic/versions/*"]
