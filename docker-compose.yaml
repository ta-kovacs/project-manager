services:
  db:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: project-manager-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/mydb
      STORAGE_DIR: /data/documents
    volumes:
      # document files outlive container rebuilds
      - documents:/data/documents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # The browser app (frontend/), served as static files on http://localhost:8080. It calls the API on
  # http://localhost:8000 (frontend/config.js), which allows that origin by default (CORS_ORIGINS).
  frontend:
    image: nginx:1.29-alpine
    container_name: project-manager-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  postgres_data:
  documents:
