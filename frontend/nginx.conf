# Production entry point (the frontend image): serves the frontend and forwards every other request to the
# API, so both share one origin and no CORS configuration is needed. The API's own URLs are unchanged:
# /projects, /login, /docs, /health, /internal/... all reach it as before.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One upload may hold up to 10 files of 10 MB each (MAX_DOCUMENT_SIZE, MAX_FILES_PER_UPLOAD).
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Frontend files when they exist; anything else is an API route.
    location / {
        # Revalidate on every load, so a deploy is picked up immediately (unchanged files answer 304).
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ @api;
    }

    location @api {
        # "app" is the API's service name in docker-compose.prod.yaml.
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads go to S3 through the API.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
