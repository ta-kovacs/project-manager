name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --group tools
      - name: Build the package (sdist and wheel)
        run: python -m build
      - name: Check the package metadata
        run: twine check --strict dist/*
      # The Lambda isn't part of the package; it's deployed as its own zip.
      - name: Compile the Lambda functions
        run: python -m compileall -q lambdas/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Only ruff, from the lint dependency group; it needs none of the app's dependencies.
      - run: pip install --group lint
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check --diff .

  test:
    name: test (Python ${{ matrix.python }}, ${{ matrix.database }} database, ${{ matrix.storage }} storage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and the one the Docker image runs.
        python: ["3.12", "3.14"]
        # The ORM backend and the one without the ORM (hand-written SQL, schema from schema.sql).
        database: [orm, sql]
        storage: [local]
        include:
          # The whole suite against a moto-mocked S3 bucket (no AWS account needed); storage doesn't
          # depend on the database backend, so once is enough.
          - python: "3.14"
            database: orm
            storage: s3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Run the tests against real Postgres in CI (locally they default to in-memory SQLite).
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/testdb
      TEST_STORAGE_BACKEND: ${{ matrix.storage }}
      TEST_DATABASE_ACCESS: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --group tools
      # `py` is tox's environment for the running interpreter: it installs the package and the test
      # dependency group, then runs pytest with the arguments after `--`.
      - name: Run tests
        run: tox -e py -- -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}-${{ matrix.database }}-${{ matrix.storage }}
          path: test-results.xml

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t project-manager:${GITHUB_SHA::7} .
      - name: Build frontend image
        run: docker build -t project-manager-frontend:${GITHUB_SHA::7} frontend
      # "app" only resolves inside the production compose network, so point it at localhost for the check.
      - name: Check the frontend's nginx configuration
        run: docker run --rm --add-host app:127.0.0.1 project-manager-frontend:${GITHUB_SHA::7} nginx -t

  migrations:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Apply migrations
        run: alembic upgrade head

  deploy:
    # Pushes to main (or a manual run on main), once the EC2_INSTANCE_ID variable is set.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    needs: [build, lint, test, docker, migrations]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      id-token: write   # needed for OIDC (AWS_ROLE_ARN)
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Authenticates with OIDC when the AWS_ROLE_ARN variable is set (preferred),
      # otherwise with the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets of a deploy-only IAM user.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: image
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'project-manager' }}:${GITHUB_SHA}"
          docker build -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      # Same repository, tagged frontend-<sha>, so no second ECR repository or IAM change is needed.
      - name: Build and push frontend image to ECR
        id: frontend
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'project-manager' }}:frontend-${GITHUB_SHA}"
          docker build -t "$image" frontend
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 (migrations, app and frontend) via SSM
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: >-
          bash .github/scripts/deploy-ec2.sh "${{ vars.EC2_INSTANCE_ID }}"
          "${{ steps.image.outputs.uri }}" "${{ steps.frontend.outputs.uri }}"

      # After the app, so the database already has the columns the Lambda's reports are stored in.
      # Skipped until the STORAGE_USAGE_LAMBDA variable names the function; the deploy role or user needs
      # lambda:UpdateFunctionCode and lambda:GetFunctionConfiguration on it.
      - name: Deploy storage-usage Lambda
        if: vars.STORAGE_USAGE_LAMBDA != ''
        run: |
          (cd lambdas/storage_usage && zip -q "$RUNNER_TEMP/storage-usage-lambda.zip" handler.py)
          aws lambda update-function-code \
            --function-name "${{ vars.STORAGE_USAGE_LAMBDA }}" \
            --zip-file "fileb://$RUNNER_TEMP/storage-usage-lambda.zip" \
            --query LastModified --output text
          aws lambda wait function-updated-v2 --function-name "${{ vars.STORAGE_USAGE_LAMBDA }}"

      - name: Summary
        run: echo "Deployed \`${{ steps.image.outputs.uri }}\` and \`${{ steps.frontend.outputs.uri }}\` to instance \`${{ vars.EC2_INSTANCE_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
