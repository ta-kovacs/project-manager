# Production stack for the single EC2 host.
# Deployed by .github/scripts/deploy-ec2.sh, which writes APP_IMAGE and
# POSTGRES_PASSWORD into a .env file next to this one on the server.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only containers on this host can reach the database.

  app:
    image: ${APP_IMAGE:?APP_IMAGE is not set}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/mydb
      # Document files live in S3; credentials come from the EC2 instance role.
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is not set}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is not set}
      # Share emails go out through SES from MAIL_SENDER; links are signed with SHARE_SECRET_KEY.
      MAIL_BACKEND: ses
      MAIL_SENDER: ${MAIL_SENDER:?MAIL_SENDER is not set}
      SHARE_SECRET_KEY: ${SHARE_SECRET_KEY:?SHARE_SECRET_KEY is not set}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Signs the access tokens (JWT) issued by POST /login.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set}
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
